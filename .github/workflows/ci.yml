name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
      - name: Typecheck API
        run: npx tsc --noEmit
        working-directory: apps/api
      - name: Typecheck Web
        run: npx tsc --noEmit
        working-directory: apps/web
      - name: Typecheck Mobile
        run: npx tsc --noEmit
        working-directory: apps/mobile
      - name: Lint API
        run: npx eslint "src/**/*.ts"
        working-directory: apps/api
      - name: Lint Web
        run: npx eslint . --max-warnings=0
        working-directory: apps/web
      - name: Lint Mobile
        run: npx eslint . --max-warnings=0
        working-directory: apps/mobile

  test-api:
    name: API Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
      - name: Run API unit tests
        run: npm run test
        working-directory: apps/api
        env:
          JWT_SECRET: test-secret-for-ci

  test-web:
    name: Web Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Web unit tests
        run: npm run test:run
        working-directory: apps/web

  test-mobile:
    name: Mobile Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Run Mobile unit tests
        run: npm run test
        working-directory: apps/mobile

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test-api, test-web]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Generate Prisma client
        run: npx prisma generate
        working-directory: apps/api
      - name: Build API
        run: npx nest build
        working-directory: apps/api
      - name: Build Web
        run: npm run build
        working-directory: apps/web
