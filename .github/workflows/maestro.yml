name: Mobile E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  maestro:
    name: Maestro E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Maestro CLI
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> $GITHUB_PATH

      - name: Run tests on Maestro Cloud
        if: env.MAESTRO_API_KEY != ''
        run: |
          maestro cloud \
            --apiKey $MAESTRO_API_KEY \
            --appSuite wam-mfugo-mobile \
            --timeout 300 \
            .maestro/
        env:
          MAESTRO_API_KEY: ${{ secrets.MAESTRO_API_KEY }}

      - name: Local validation (no device)
        if: env.MAESTRO_API_KEY == ''
        run: |
          echo "Maestro API key not set. Skipping cloud tests."
          echo "Set MAESTRO_API_KEY secret to enable cloud E2E testing."
          echo "Free tier: https://maestro.mobile.dev/"
