# Render Blueprint — deploys the Wam Mfugo API as a managed web service.
# Usage: push this repo to GitHub, create a new Blueprint in Render from it,
# then set the sync:false env vars in the Render dashboard.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wam-mfugo-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: npm install && npm run build:api
    preDeployCommand: npx prisma db push --schema apps/api/prisma/schema.prisma --accept-data-loss && npx prisma generate --schema apps/api/prisma/schema.prisma
    startCommand: node apps/api/dist/main.js
    healthCheckPath: /api/health
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /opt/render/project/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: UPLOAD_DIR
        value: /opt/render/project/uploads
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: EMAIL_PROVIDER
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: DEV_AUTO_VERIFY
        sync: false
      - key: OTP_EXPIRY_MINUTES
        value: "5"
      - key: OTP_MAX_REQUESTS
        value: "5"
      - key: OTP_LOCKOUT_MINUTES
        value: "15"
      - key: DEFAULT_ADMIN_EMAIL
        sync: false
      - key: KALRO_API_URL
        sync: false
      - key: KALRO_CLIENT_ID
        sync: false
      - key: KIAMIS_API_URL
        sync: false
      - key: KIAMIS_API_KEY
        sync: false