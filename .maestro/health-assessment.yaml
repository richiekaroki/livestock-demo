# Health Assessment - Maestro E2E Test
# Tests the health assessment flow

appId: com.wam-mfugo.mobile
---
- launchApp

# Navigate to health assessment
- tapOn:
    id: "tab-more"
    optional: true

- tapOn:
    text: "Health Assessment"
    optional: true

# Should see health assessment screen
- assertVisible:
    text: "Health"
    optional: true

- assertVisible:
    text: "Assessment"
    optional: true

# Select an animal (if list available)
- tapOn:
    id: "animal-list"
    optional: true

- tapOn:
    text: "Select Animal"
    optional: true

# Take screenshot
- takeScreenshot: health_assessment
