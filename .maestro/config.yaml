# Maestro Configuration
# Run tests with: maestro test .maestro/

appId: com.wam-mfugo.mobile

# Environment
env:
  API_URL: https://wam-mfugo-demo.onrender.com

# Tags to filter tests
tags:
  - smoke
  - regression

# Smooth scroll for better animations
smoothScroll: true

# Take screenshots on failure
onFailure:
  - takeScreenshot
  - pressKey: Back
