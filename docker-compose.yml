# Wam Mfugo local stack: Postgres + API + Web.
# Usage: docker compose up --build
#   API  -> http://localhost:4000/api        (docs: /api/docs)
#   Web  -> http://localhost:5173
#
# Before running, create apps/api/.env with at minimum:
#   JWT_SECRET=<any-random-string>
#   CORS_ORIGIN=http://localhost:5173
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-wam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-wam}
      POSTGRES_DB: ${POSTGRES_DB:-wam_mfugo}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-wam} -d ${POSTGRES_DB:-wam_mfugo}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - path: apps/api/.env
        required: false
    environment:
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-wam}:${POSTGRES_PASSWORD:-wam}@db:5432/${POSTGRES_DB:-wam_mfugo}?schema=public
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      EMAIL_PROVIDER: console
      NODE_ENV: ${NODE_ENV:-development}
      UPLOAD_DIR: /app/uploads
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run prisma:seed -w @wam-mfugo/api && node apps/api/dist/main.js"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:4000/api
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  uploads:
